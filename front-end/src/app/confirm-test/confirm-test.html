<p-toast position="bottom-right" />

<p-confirmdialog
  [pt]="{
    root: {
      root: {
        class: 'w-[450px] rounded-2xl shadow-2xl'
      }
    },
    header: {
      class: 'px-6 py-4'
    },
    content: {
      class: 'px-6 py-5'
    },
    footer: {
      class: 'px-6 py-4'
    }
  }"
/>

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '35rem' }"
>
  <ng-template #header>
    {{ header }}
  </ng-template>

  <ng-content></ng-content>

  <ng-template #footer>
    <ng-content select="[dialog-footer]"></ng-content>
  </ng-template>
</p-dialog>
