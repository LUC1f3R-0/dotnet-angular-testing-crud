<p-toast
  [pt]="{
    root: {
      class: 'w-[400px]'
    },
    message: {
      class: 'rounded-xl shadow-2xl'
    }
  }"
/>

<p-confirmdialog
  [pt]="{
    root: {
      root: {
        class: 'w-[450px] rounded-2xl shadow-2xl'
      }
    },
    header: {
      class: 'px-6 py-4'
    },
    content: {
      class: 'px-6 py-5'
    },
    footer: {
      class: 'px-6 py-4'
    }
  }"
/>
